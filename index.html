<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嘉立创集团介绍 | 一站式产业互联智造平台</title>
<style>
  :root{
    --bg:#0a0f1c;
    --text:#eaf2ff;
    --muted:#93a6c0;
    --accent:#1f8fff;
    --gap:26px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 15% -8%,#12325c 0%,transparent 60%),
      radial-gradient(900px 600px at 100% 105%,#0e2a4d 0%,transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  }

  /* 顶部悬浮条 */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:12px;
    padding:10px 20px;
    background:rgba(10,15,28,.72);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.10);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.4px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .brand small{font-weight:400;color:var(--muted);font-size:12px}
  .topbar .spacer{flex:1}
  .topbar .page{
    font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);
    min-width:64px;text-align:right;
  }
  .topbar .page b{color:#fff}
  .btn{
    background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--text);
    padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;
    transition:.2s;font-family:inherit;
  }
  .btn:hover{border-color:var(--accent);color:#fff}

  /* 订阅流 */
  .deck{
    max-width:1240px;margin:0 auto;
    padding:calc(56px + var(--gap)) 24px 90px;
    display:flex;flex-direction:column;gap:var(--gap);
  }
  figure.slide{
    margin:0;position:relative;
    opacity:0;transform:translateY(24px);
    transition:opacity .5s ease,transform .5s ease;
  }
  figure.slide.in{opacity:1;transform:none}
  figure.slide img{
    width:100%;height:auto;display:block;
    border-radius:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    background:#fff;
    cursor:zoom-in;
  }
  figure.slide .no{
    position:absolute;top:10px;left:12px;
    font-size:12px;color:#fff;
    background:rgba(8,14,26,.55);border:1px solid rgba(255,255,255,.18);
    padding:2px 9px;border-radius:20px;backdrop-filter:blur(4px);
    opacity:0;transition:opacity .25s;
  }
  figure.slide:hover .no{opacity:1}

  /* 回到顶部 */
  .toTop{
    position:fixed;right:22px;bottom:26px;z-index:20;
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(15,25,45,.8);border:1px solid rgba(255,255,255,.18);
    color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:.25s;
  }
  .toTop.show{opacity:1;pointer-events:auto}
  .toTop:hover{background:var(--accent);border-color:var(--accent)}

  /* 全屏看图 */
  .lightbox{
    position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.95);
    display:none;align-items:center;justify-content:center;padding:10px;
  }
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
  .lightbox .close{
    position:absolute;top:16px;right:22px;color:#fff;font-size:32px;
    line-height:1;opacity:.7;cursor:pointer;
  }
  .lightbox .close:hover{opacity:1}

  @media (max-width:720px){
    :root{--gap:14px}
    .brand small{display:none}
    .deck{padding:calc(50px + var(--gap)) 10px 70px}
    .topbar{padding:8px 12px}
    .toTop{right:14px;bottom:16px;width:40px;height:40px}
  }
  @media print{
    .topbar,.toTop{display:none}
    body{background:#fff}
    .deck{padding:0;gap:0;max-width:none}
    figure.slide{opacity:1!important;transform:none!important;break-after:page;page-break-after:always}
    figure.slide img{box-shadow:none;border-radius:0}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>嘉立创集团<small>一站式产业互联智造平台 · 001232.SZ</small></div>
  <div class="spacer"></div>
  <div class="page"><b id="pageNow">1</b> / 18</div>
  <button class="btn" id="fsBtn">全屏</button>
</div>

<div class="deck" id="deck"></div>

<div class="toTop" id="toTop" title="回到顶部">↑</div>

<div class="lightbox" id="lightbox">
  <span class="close" id="closeLightbox">×</span>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
(function(){
  var TOTAL = 18;
  var deck = document.getElementById('deck');
  var pageNow = document.getElementById('pageNow');
  var toTop = document.getElementById('toTop');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');

  // 生成所有页面（长图滚动）
  for (var i = 1; i <= TOTAL; i++) {
    var name = 'slides/slide-' + (i < 10 ? '0' + i : i) + '.jpg';
    var fig = document.createElement('figure');
    fig.className = 'slide';
    fig.dataset.page = i;
    fig.innerHTML = '<img loading="lazy" src="' + name + '" alt="第 ' + i + ' 页"><span class="no">' + i + ' / ' + TOTAL + '</span>';
    deck.appendChild(fig);
  }

  // 淡入动画
  var figures = Array.prototype.slice.call(document.querySelectorAll('figure.slide'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, {rootMargin: '0px 0px -8% 0px', threshold: 0.01});
    figures.forEach(function(f){ io.observe(f); });
  } else {
    figures.forEach(function(f){ f.classList.add('in'); });
  }

  // 顶部页码：跟随当前可视页
  if ('IntersectionObserver' in window) {
    var pageIo = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) pageNow.textContent = en.target.dataset.page;
      });
    }, {threshold: 0.5});
    figures.forEach(function(f){ pageIo.observe(f); });
  }

  // 回到顶部按钮
  window.addEventListener('scroll', function(){
    toTop.classList.toggle('show', window.scrollY > 600);
  }, {passive:true});
  toTop.addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });

  // 点击图片放大
  deck.addEventListener('click', function(e){
    var img = e.target.closest('img');
    if (!img) return;
    lightboxImg.src = img.getAttribute('src');
    lightbox.classList.add('open');
  });
  document.getElementById('closeLightbox').addEventListener('click', function(){
    lightbox.classList.remove('open');
  });
  lightbox.addEventListener('click', function(e){
    if (e.target === lightbox) lightbox.classList.remove('open');
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });

  // 全屏切换
  document.getElementById('fsBtn').addEventListener('click', function(){
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', function(){
    document.getElementById('fsBtn').textContent = document.fullscreenElement ? '退出全屏' : '全屏';
  });
})();
</script>
</body>
</html>
